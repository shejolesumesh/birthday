<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170b2e">
<title>Happy Birthday! 🎉</title>
<meta name="description" content="Happy Birthday to You!">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>


<canvas id="bg-canvas" aria-hidden="true"></canvas>
<canvas id="confetti-canvas" aria-hidden="true"></canvas>

<div id="balloon-layer" aria-hidden="true"></div>

<main class="stage">

  <div class="glow-orb glow-orb--pink"></div>
  <div class="glow-orb glow-orb--blue"></div>

  <section class="card" id="card">
    <p class="eyebrow" id="eyebrow">a little celebration for you</p>

    <h1 class="headline" id="headline" aria-label="Happy Birthday to You!">
      <span class="line line-1"><span class="word">Happy</span></span>
      <span class="line line-2"><span class="word">Birthday</span></span>
      <span class="line line-3"><span class="word">to You!</span></span>
            <span class="line line-3"><span class="word">Vanshita!</span></span>

      <span class="headline-emoji" aria-hidden="true">🎉🎂</span>
    </h1>

    <button class="cake-btn" id="cake-btn" aria-label="Celebrate again">
      <svg class="cake-svg" viewBox="0 0 200 150" aria-hidden="true">
      
        <ellipse cx="100" cy="138" rx="86" ry="9" fill="rgba(255,255,255,0.14)"></ellipse>
      
        <rect x="34" y="96" width="132" height="38" rx="10" fill="url(#baseGrad)"></rect>
      
        <rect x="48" y="66" width="104" height="34" rx="9" fill="url(#midGrad)"></rect>
        
        <rect x="64" y="42" width="72" height="28" rx="8" fill="url(#topGrad)"></rect>
      
        <path d="M64 70 q6 14 12 0 q6 14 12 0 q6 14 12 0 q6 14 12 0 q6 14 12 0 q6 14 12 0 V70Z" fill="#ffd166" opacity="0.9"></path>
        
        <g id="candle-group">
          <rect x="78" y="24" width="5" height="18" rx="2" fill="#fff2d6"></rect>
          <rect x="98" y="20" width="5" height="22" rx="2" fill="#fff2d6"></rect>
          <rect x="118" y="24" width="5" height="18" rx="2" fill="#fff2d6"></rect>
          <g class="flame-group">
            <ellipse class="flame" cx="80.5" cy="19" rx="4" ry="7" fill="url(#flameGrad)"></ellipse>
            <ellipse class="flame" cx="100.5" cy="15" rx="4" ry="7" fill="url(#flameGrad)"></ellipse>
            <ellipse class="flame" cx="120.5" cy="19" rx="4" ry="7" fill="url(#flameGrad)"></ellipse>
          </g>
        </g>
        <defs>
          <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c77dff"></stop>
            <stop offset="1" stop-color="#8a4fd9"></stop>
          </linearGradient>
          <linearGradient id="midGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff9ecb"></stop>
            <stop offset="1" stop-color="#ff6fb0"></stop>
          </linearGradient>
          <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8ed7ff"></stop>
            <stop offset="1" stop-color="#5ec8ff"></stop>
          </linearGradient>
          <radialGradient id="flameGrad" cx="0.5" cy="0.7" r="0.7">
            <stop offset="0" stop-color="#fff6cf"></stop>
            <stop offset="0.55" stop-color="#ffd166"></stop>
            <stop offset="1" stop-color="#ff8a3d"></stop>
          </radialGradient>
        </defs>
      </svg>
      <span class="cake-hint">tap to celebrate</span>
    </button>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
